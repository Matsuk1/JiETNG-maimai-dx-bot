<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JiETNG · 图片调试台</title><link rel="stylesheet" href="/static/lab.css"><script src="/static/lab.js" defer></script></head>
<body><aside class="sidebar"><a class="brand" href="/">JiETNG <span>IMAGE LAB</span></a><div class="sidebar-heading">示例场景 <span id="case-count"></span></div><nav id="examples" aria-label="图片示例"></nav><div class="sidebar-note"><span class="dot"></span> 本地开发环境<br><small>固定示例数据 · 正式渲染模板</small></div></aside>
<main><header class="page-header"><div><div class="eyebrow">DESIGN / LIVE PREVIEW</div><h1>图片调试台</h1><p>调整数据，立即查看真实图片效果。</p></div><div class="header-actions"><label class="toggle"><input id="auto" type="checkbox" checked>自动更新</label><button id="refresh">重新渲染 <kbd>⌘ ↵</kbd></button></div></header>
<div class="workbench"><section class="editor-panel"><div class="panel-heading"><div><h2 id="case-title">载入示例…</h2><p id="case-description"></p></div><span class="tag">FIXTURE</span></div><div id="quick-fields" class="quick-fields"></div><div class="editor-toolbar"><strong>JSON 数据</strong><div><button id="format" class="text-button">格式化</button><button id="reset" class="text-button">重置</button></div></div><textarea id="editor" spellcheck="false" aria-label="示例 JSON 数据"></textarea><div class="editor-footer"><span id="draft-state">示例原始数据</span><button id="export" class="text-button">导出 JSON ↗</button></div><div class="source"><span>编辑以下模板，保存后自动刷新</span><code id="source-path"></code></div></section>
<section class="preview-panel"><div class="preview-toolbar"><div class="render-state"><span class="dot" id="status-dot"></span><span id="status" role="status">准备就绪</span></div><div class="preview-controls"><select id="backdrop" aria-label="预览背景"><option value="checker">透明网格</option><option value="white">白色背景</option><option value="dark">深色背景</option></select><select id="zoom" aria-label="预览缩放"><option value="fit">适应画布</option><option value="0.5">50%</option><option value="1">100%</option><option value="2">200%</option><option value="3">300%</option></select><button id="download" disabled>下载 PNG ↓</button></div></div><div id="error" role="alert" hidden></div><div id="viewport" class="viewport checker"><div id="image-wrap"><img id="preview" alt="当前示例的实时渲染结果" hidden></div><div id="empty"><div class="empty-icon">▧</div><h3>正在准备画布</h3><p>首次渲染需要启动 Chromium</p></div></div><footer class="preview-footer"><span id="dimensions">— × — px</span><span id="timing">Playwright / Chromium</span><span id="watcher">模板监听中</span></footer></section></div>
</main></body></html>
