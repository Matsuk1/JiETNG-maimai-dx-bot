<!-- Theme color for browser chrome (移动浏览器主题色) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">

<style>
  /* ========================================
     Common Base Styles - 通用基础样式
     由所有页面共享的基础样式和 CSS 变量
     ======================================== */

  /* CSS 变量定义 - CSS Variables */
  :root {
    color-scheme: light dark;

    /* 浅色模式背景 - Light Mode Backgrounds */
    --bg-gradient-1: #F5F5F7;
    --bg-gradient-2: #FFFFFF;
    --bg-gradient-3: #EEF2F7;
    --bg-gradient-4: #E8EDF5;

    /* 基础文字颜色 - Base Text Colors */
    --text-color: #1D1D1F;
    --text-secondary: #6E6E73;
    --text-tertiary: #A1A1A6;

    /* 卡片和表面 - Cards & Surfaces */
    --glass-bg: rgba(255, 255, 255, 0.78);
    --glass-border: rgba(255, 255, 255, 0.7);
    --card-bg: rgba(255, 255, 255, 0.86);
    --surface-bg: #F5F5F7;
    --input-bg: rgba(255, 255, 255, 0.68);
    --hover-bg: rgba(0, 0, 0, 0.045);

    /* 主题色 - Theme Colors */
    --accent-color: #0071E3;
    --accent-hover: #0077ED;
    --accent-light: rgba(0, 113, 227, 0.12);

    /* 品牌色 - Brand Colors */
    --burgundy: #660033;
    --crimson: #990000;
    --deep-red: #810020;

    /* 状态颜色 - Status Colors */
    --success-color: #34C759;
    --success-light: rgba(52, 199, 89, 0.12);
    --warning-color: #FF9F0A;
    --warning-light: rgba(255, 159, 10, 0.14);
    --danger-color: #FF3B30;
    --danger-light: rgba(255, 59, 48, 0.12);
    --error-color: #FF3B30;
    --error-light: rgba(255, 59, 48, 0.12);
    --info-color: #0071E3;
    --info-light: rgba(0, 113, 227, 0.12);

    /* 阴影 - Shadows */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 10px 24px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.12);
    --shadow-xl: 0 36px 90px rgba(0, 0, 0, 0.16);

    /* 边框 - Borders */
    --border-color: rgba(0, 0, 0, 0.08);
    --border-hover: rgba(0, 0, 0, 0.18);

    /* 间距 - Spacing */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --radius-xl: 28px;

    /* 过渡 - Transitions */
    --transition-fast: 0.15s ease-out;
    --transition-base: 0.2s ease-out;
    --transition-slow: 0.3s ease-out;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      /* 深色模式背景 - Dark Mode Backgrounds */
      --bg-gradient-1: #000000;
      --bg-gradient-2: #101013;
      --bg-gradient-3: #1C1C1E;
      --bg-gradient-4: #2C2C2E;

      /* 基础文字颜色 - Base Text Colors */
      --text-color: #F5F5F7;
      --text-secondary: #B8B8BD;
      --text-tertiary: #7D7D84;

      /* 卡片和表面 - Cards & Surfaces */
      --glass-bg: rgba(28, 28, 30, 0.72);
      --glass-border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(28, 28, 30, 0.82);
      --surface-bg: #000000;
      --input-bg: rgba(44, 44, 46, 0.72);
      --hover-bg: rgba(255, 255, 255, 0.08);

      /* 主题色 - Theme Colors */
      --accent-color: #0A84FF;
      --accent-hover: #409CFF;
      --accent-light: rgba(10, 132, 255, 0.18);

      /* 状态颜色 - Status Colors */
      --success-color: #30D158;
      --success-light: rgba(48, 209, 88, 0.16);
      --warning-color: #FFD60A;
      --warning-light: rgba(255, 214, 10, 0.14);
      --danger-color: #FF453A;
      --danger-light: rgba(255, 69, 58, 0.15);
      --error-color: #FF453A;
      --error-light: rgba(255, 69, 58, 0.15);
      --info-color: #0A84FF;
      --info-light: rgba(10, 132, 255, 0.18);

      /* 阴影 - Shadows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.36);
      --shadow-md: 0 12px 26px rgba(0, 0, 0, 0.42);
      --shadow-lg: 0 24px 70px rgba(0, 0, 0, 0.52);
      --shadow-xl: 0 44px 100px rgba(0, 0, 0, 0.62);

      /* 边框 - Borders */
      --border-color: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.22);
    }
  }

  /* 全局重置 - Global Reset */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  /* iOS 防自动缩放 - Prevent iOS auto-zoom on input focus (requires font-size ≥ 16px) */
  input, select, textarea {
    font-size: 16px;
  }

  /* ========================================
     Safari 安全区域修复 - Safari Safe Area Fix
     html 和 body 都必须有相同的背景色
     ======================================== */

  /* HTML 纯色背景 - 作为备用，实际渐变在 body::before */
  html {
    min-height: 100%;
    background: var(--bg-gradient-1);
  }

  /* Body 样式 - Body Styles */
  body {
    background:
      radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.9), transparent 36rem),
      linear-gradient(180deg, var(--bg-gradient-2) 0%, var(--bg-gradient-1) 42%, var(--bg-gradient-3) 100%);
    color: var(--text-color);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", "Yu Gothic", "Meiryo", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    min-height: 100dvh;
    /* 底部 home indicator 安全区域 */
    padding-bottom: env(safe-area-inset-bottom);
    position: relative;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  @media (prefers-color-scheme: dark) {
    body {
      background:
        radial-gradient(circle at 50% -18%, rgba(82, 82, 92, 0.42), transparent 34rem),
        linear-gradient(180deg, var(--bg-gradient-2) 0%, var(--bg-gradient-1) 46%, #050506 100%);
    }
  }

  button,
  input,
  select,
  textarea {
    font-family: inherit;
  }

  button,
  input[type="submit"],
  input[type="button"] {
    -webkit-tap-highlight-color: transparent;
  }

  select {
    background-image:
      linear-gradient(45deg, transparent 50%, var(--text-tertiary) 50%),
      linear-gradient(135deg, var(--text-tertiary) 50%, transparent 50%);
    background-position:
      calc(100% - 15px) calc(50% - 2px),
      calc(100% - 10px) calc(50% - 2px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  /* 全局过渡动画 - Global Transitions */
  * {
    transition: background-color var(--transition-base),
                border-color var(--transition-base),
                color var(--transition-base);
  }

  /* 移除动画以减少干扰 - Remove distracting animations */
  *:focus {
    outline: 2px solid var(--accent-color);
    outline-offset: 2px;
  }

  *:focus:not(:focus-visible) {
    outline: none;
  }

  *:focus-visible {
    outline: 2px solid var(--accent-color);
    outline-offset: 2px;
  }

  /* ========================================
     通知块 - Notice Block
     ======================================== */

  .notice {
    margin: 22px 0 0;
    padding: 14px 16px;
    background: rgba(118, 118, 128, 0.08);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.45;
  }

  .notice strong {
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 4px;
  }

  @media (max-width: 600px) {
    .notice {
      font-size: 11px;
    }
  }

  /* ========================================
     列表面板组件 - List Panel Component
     带标题行 + 分割线列表项的通用卡片面板
     ======================================== */

  .list-panel {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--card-bg);
    box-shadow: var(--shadow-sm);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
  }

  .list-panel-header {
    padding: 14px 18px;
    background: transparent;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-color);
  }

  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border-color);
    gap: 12px;
  }

  .list-item:last-child {
    border-bottom: none;
  }

  .list-item-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .list-item-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-color);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0;
  }

  .list-item-label.dim {
    color: var(--text-tertiary);
  }

  .list-item-meta {
    font-size: 11px;
    color: var(--text-tertiary);
    font-family: monospace;
  }

  /* 小徽章标签 */
  .badge {
    font-size: 11px;
    color: var(--text-tertiary);
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 3px 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ========================================
     列表面板内联表单 - List Panel Inline Form
     label 左 / 控件右，同 iOS 设置页风格
     ======================================== */

  .list-panel .list-item label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-color);
    flex-shrink: 0;
    margin-bottom: 0;
    cursor: default;
  }

  .list-panel .list-item input[type="text"],
  .list-panel .list-item input[type="password"] {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    text-align: right;
    color: var(--text-secondary);
    font-size: 16px;
    font-family: inherit;
    margin-bottom: 0;
    padding: 0 2px;
    cursor: text;
  }

  .list-panel .list-item input[type="text"]::placeholder,
  .list-panel .list-item input[type="password"]::placeholder {
    color: var(--text-tertiary);
  }

  .list-panel .list-item input[readonly] {
    color: var(--text-tertiary);
    cursor: default;
  }

  .list-panel .list-item select {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    text-align: right;
    text-align-last: right;
    color: var(--text-secondary);
    font-size: 16px;
    font-family: inherit;
    margin-bottom: 0;
    padding: 0 18px 0 0;
    cursor: pointer;
  }

  /* 危险操作按钮（描边样式） */
  .btn-danger {
    font-size: 12px;
    font-weight: 600;
    color: var(--error-color);
    background: transparent;
    border: 1px solid var(--error-color);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
    transition: all var(--transition-base);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .btn-danger:hover {
    background: var(--error-color);
    color: #fff;
  }

  .btn-danger:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  @supports ((-webkit-backdrop-filter: blur(24px)) or (backdrop-filter: blur(24px))) {
    .glass-surface {
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }
  }
</style>
