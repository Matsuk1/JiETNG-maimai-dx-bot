<!DOCTYPE html>
<html lang="{{ default_language }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
  <title>AI Operations | JiETNG</title>
  <link rel="icon" type="image/png" href="/static/pics/logo.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/admin-icon.png">
  <style>
    :root {
      color-scheme: light dark;
      --ai-bg: #ffffff;
      --ai-surface: #f4f4f4;
      --ai-surface-hover: #e9e9e9;
      --ai-text: #1f1f1f;
      --ai-muted: #6f6f6f;
      --ai-border: #e5e5e5;
      --ai-action: #111111;
      --ai-action-text: #ffffff;
      --ai-danger: #d93b3b;
      --ai-user: #f4f4f4;
      --ai-code: #f6f6f6;
      --ai-focus: #1683ff;
      --ai-safe-top: env(safe-area-inset-top, 0px);
      --ai-safe-bottom: env(safe-area-inset-bottom, 0px);
      --ai-composer-bottom: max(10px, var(--ai-safe-bottom));
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ai-bg: #212121;
        --ai-surface: #2f2f2f;
        --ai-surface-hover: #3a3a3a;
        --ai-text: #ececec;
        --ai-muted: #a3a3a3;
        --ai-border: #3f3f3f;
        --ai-action: #ffffff;
        --ai-action-text: #111111;
        --ai-danger: #ff5a52;
        --ai-user: #2f2f2f;
        --ai-code: #171717;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ai-bg);
      color: var(--ai-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Yu Gothic", Meiryo, sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    html.ai-standalone,
    html.ai-standalone body {
      height: 100vh;
      min-height: 100vh;
    }

    html.ai-standalone {
      --ai-safe-bottom: max(env(safe-area-inset-bottom, 0px), 24px);
      --ai-composer-bottom: var(--ai-safe-bottom);
    }

    button,
    textarea {
      color: inherit;
      font: inherit;
    }

    button,
    a,
    label {
      -webkit-tap-highlight-color: transparent;
    }

    .ai-app {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
    }

    html.ai-standalone .ai-app {
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
    }

    .ai-sidebar {
      position: relative;
      z-index: 30;
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      gap: 10px;
      min-height: 0;
      padding: max(14px, var(--ai-safe-top)) 10px max(12px, var(--ai-safe-bottom));
      border-right: 1px solid var(--ai-border);
      background: var(--ai-surface);
    }

    .ai-sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 36px;
      padding: 0 8px;
    }

    .ai-sidebar-close,
    .ai-menu-button {
      display: none;
    }

    .ai-new-chat {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 42px;
      padding: 8px 11px;
      border: 1px solid var(--ai-border);
      border-radius: 7px;
      background: var(--ai-bg);
      color: var(--ai-text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
    }

    .ai-new-chat:hover {
      background: var(--ai-surface-hover);
    }

    .ai-new-chat > span:first-child {
      font-size: 21px;
      font-weight: 300;
      line-height: 1;
    }

    .ai-sidebar-label {
      padding: 6px 9px 0;
      color: var(--ai-muted);
      font-size: 11px;
      font-weight: 600;
    }

    .ai-conversation-list {
      min-height: 0;
      overflow-y: auto;
    }

    .ai-conversation-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 28px;
      align-items: center;
      min-height: 38px;
      border-radius: 6px;
    }

    .ai-conversation-item:hover,
    .ai-conversation-item.active {
      background: var(--ai-surface-hover);
    }

    .ai-conversation-select,
    .ai-conversation-delete {
      min-width: 0;
      height: 36px;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
      color: var(--ai-text);
      cursor: pointer;
    }

    .ai-conversation-select {
      padding-left: 10px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ai-conversation-delete {
      opacity: 0;
      color: var(--ai-muted);
      font-size: 17px;
    }

    .ai-conversation-item:hover .ai-conversation-delete,
    .ai-conversation-item.active .ai-conversation-delete,
    .ai-conversation-delete:focus-visible {
      opacity: 1;
    }

    .ai-sidebar-footer {
      display: grid;
      gap: 2px;
      padding-top: 8px;
      border-top: 1px solid var(--ai-border);
    }

    .ai-sidebar-footer a {
      min-height: 34px;
      padding: 7px 10px;
      border-radius: 5px;
      color: var(--ai-muted);
      font-size: 12px;
      text-decoration: none;
    }

    .ai-sidebar-footer a:hover {
      background: var(--ai-surface-hover);
      color: var(--ai-text);
    }

    .ai-sidebar-backdrop {
      display: none;
    }

    .ai-stage {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
    }

    .ai-topbar {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      min-height: calc(58px + var(--ai-safe-top));
      padding: var(--ai-safe-top) 18px 0;
      border-bottom: 1px solid var(--ai-border);
      background: color-mix(in srgb, var(--ai-bg) 94%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .ai-topbar-start {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .ai-current-title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ai-brand {
      display: inline-flex;
      align-items: center;
      justify-self: start;
      gap: 9px;
      min-width: 0;
      color: var(--ai-text);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .ai-brand img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .ai-topbar-actions {
      display: flex;
      align-items: center;
      justify-self: end;
      gap: 12px;
    }

    .ai-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--ai-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .ai-status i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #28a745;
    }

    .ai-status.busy i {
      background: #e3a008;
    }

    .ai-status.error i {
      background: var(--ai-danger);
    }

    .ai-icon-button,
    .ai-attach,
    .ai-send {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }

    .ai-icon-button,
    .ai-attach {
      background: transparent;
      color: var(--ai-text);
      font-size: 24px;
      font-weight: 300;
    }

    .ai-icon-button:hover,
    .ai-attach:hover {
      background: var(--ai-surface-hover);
    }

    .ai-icon-button:disabled,
    .ai-attach.disabled {
      cursor: default;
      opacity: 0.4;
      pointer-events: none;
    }

    .ai-icon-button.ai-sidebar-close,
    .ai-icon-button.ai-menu-button {
      display: none;
    }

    .ai-chat {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 0;
    }

    .ai-messages {
      display: flex;
      flex-direction: column;
      gap: 26px;
      min-height: 0;
      padding: 34px max(20px, calc((100% - 800px) / 2)) 26px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .ai-empty {
      display: grid;
      place-items: center;
      flex: 1 1 auto;
      min-height: 180px;
      opacity: 0.12;
    }

    .ai-empty img {
      width: 74px;
      height: 74px;
      object-fit: contain;
    }

    .ai-message {
      display: flex;
      width: 100%;
    }

    .ai-message.user {
      justify-content: flex-end;
    }

    .ai-message-body {
      width: 100%;
      max-width: 100%;
      color: var(--ai-text);
      font-size: 15px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .ai-message.user .ai-message-body {
      width: auto;
      max-width: min(78%, 620px);
      padding: 10px 15px;
      border-radius: 18px;
      background: var(--ai-user);
      white-space: pre-wrap;
    }

    .ai-message.error .ai-message-body {
      padding-left: 12px;
      border-left: 3px solid var(--ai-danger);
      color: var(--ai-danger);
      white-space: pre-wrap;
    }

    .ai-activity {
      margin-bottom: 8px;
      color: var(--ai-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .ai-reasoning {
      margin-bottom: 14px;
      color: var(--ai-muted);
      font-size: 13px;
    }

    .ai-reasoning summary {
      width: fit-content;
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }

    .ai-reasoning-text {
      margin-top: 9px;
      padding-left: 13px;
      border-left: 2px solid var(--ai-border);
      white-space: pre-wrap;
    }

    .ai-reasoning-text.markdown-rendered {
      white-space: normal;
    }

    :is(.ai-message-text, .ai-reasoning-text) > :first-child {
      margin-top: 0;
    }

    :is(.ai-message-text, .ai-reasoning-text) > :last-child {
      margin-bottom: 0;
    }

    :is(.ai-message-text, .ai-reasoning-text) :is(h1, h2, h3, h4, h5, h6) {
      margin: 18px 0 8px;
      font-size: 16px;
      line-height: 1.4;
    }

    :is(.ai-message-text, .ai-reasoning-text) :is(p, ul, ol, blockquote, pre) {
      margin: 0 0 12px;
    }

    :is(.ai-message-text, .ai-reasoning-text) :is(ul, ol) {
      padding-left: 24px;
    }

    :is(.ai-message-text, .ai-reasoning-text) blockquote {
      padding-left: 12px;
      border-left: 3px solid var(--ai-border);
      color: var(--ai-muted);
    }

    :is(.ai-message-text, .ai-reasoning-text) :not(pre) > code {
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--ai-surface);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    :is(.ai-message-text, .ai-reasoning-text) pre {
      position: relative;
      max-width: 100%;
      padding: 14px;
      overflow-x: auto;
      border: 1px solid var(--ai-border);
      border-radius: 6px;
      background: var(--ai-code);
      white-space: pre;
    }

    :is(.ai-message-text, .ai-reasoning-text) pre.ai-code-block {
      padding-top: 42px;
    }

    :is(.ai-message-text, .ai-reasoning-text) pre code {
      font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .ai-table-scroll {
      max-width: 100%;
      margin: 0 0 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    :is(.ai-message-text, .ai-reasoning-text) table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
    }

    :is(.ai-message-text, .ai-reasoning-text) :is(th, td) {
      padding: 7px 10px;
      border: 1px solid var(--ai-border);
      text-align: left;
      white-space: nowrap;
    }

    :is(.ai-message-text, .ai-reasoning-text) a {
      color: var(--ai-focus);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .ai-message-text:empty {
      display: none;
    }

    .ai-message.streaming .ai-message-text:not(:empty)::after {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 2px;
      background: currentColor;
      content: "";
      vertical-align: -2px;
      animation: ai-caret 0.8s steps(1) infinite;
    }

    @keyframes ai-caret {
      50% { opacity: 0; }
    }

    .ai-message-media {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 280px));
      gap: 10px;
      margin-top: 12px;
    }

    .ai-message-media img {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border: 1px solid var(--ai-border);
      border-radius: 7px;
      background: var(--ai-surface);
    }

    .ai-message-actions {
      display: flex;
      justify-content: flex-start;
      margin-top: 10px;
    }

    .ai-copy-button {
      min-height: 28px;
      padding: 4px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--ai-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .ai-copy-button:hover,
    .ai-copy-button:focus-visible {
      background: var(--ai-surface-hover);
      color: var(--ai-text);
    }

    .ai-code-copy {
      position: absolute;
      top: 7px;
      right: 7px;
      border: 1px solid var(--ai-border);
      background: var(--ai-surface);
    }

    .ai-composer-dock {
      padding: 0 max(16px, calc((100% - 800px) / 2)) var(--ai-composer-bottom);
      background: var(--ai-bg);
    }

    .ai-composer {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: end;
      gap: 8px;
      min-height: 56px;
      padding: 8px;
      border: 1px solid var(--ai-border);
      border-radius: 26px;
      background: var(--ai-surface);
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.08);
    }

    .ai-composer:focus-within {
      border-color: color-mix(in srgb, var(--ai-text) 32%, var(--ai-border));
    }

    .ai-input {
      width: 100%;
      min-height: 38px;
      max-height: 180px;
      padding: 8px 0 6px;
      overflow-y: auto;
      border: 0;
      outline: 0;
      background: transparent;
      resize: none;
      font-size: 16px;
      line-height: 24px;
    }

    .ai-input:disabled {
      opacity: 0.62;
    }

    .ai-attach {
      position: relative;
      margin-bottom: 2px;
      font-size: 25px;
      font-weight: 300;
    }

    .ai-attach input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .ai-send {
      margin-bottom: 2px;
      background: var(--ai-action);
      color: var(--ai-action-text);
      font-size: 21px;
      font-weight: 650;
      line-height: 1;
    }

    .ai-send.stop {
      background: var(--ai-danger);
      color: #ffffff;
      font-size: 12px;
    }

    .ai-send:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .ai-attachments {
      grid-column: 1 / -1;
      display: flex;
      gap: 9px;
      padding: 4px 2px 0;
      overflow-x: auto;
    }

    .ai-attachments[hidden] {
      display: none;
    }

    .ai-attachment {
      position: relative;
      flex: 0 0 84px;
      width: 84px;
      height: 64px;
    }

    .ai-attachment img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 1px solid var(--ai-border);
      border-radius: 7px;
    }

    .ai-attachment button {
      position: absolute;
      top: -6px;
      right: -6px;
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      padding: 0 0 2px;
      border: 2px solid var(--ai-surface);
      border-radius: 50%;
      background: #111111;
      color: #ffffff;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    @media (max-width: 800px) {
      .ai-app {
        display: block;
      }

      .ai-stage {
        width: 100%;
        height: 100%;
      }

      .ai-sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(86vw, 310px);
        transform: translateX(-101%);
        transition: transform 0.18s ease-out;
      }

      body.history-open .ai-sidebar {
        transform: translateX(0);
      }

      .ai-sidebar-backdrop {
        position: fixed;
        z-index: 20;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: rgba(0, 0, 0, 0.42);
      }

      body.history-open .ai-sidebar-backdrop {
        display: block;
      }

      .ai-icon-button.ai-sidebar-close,
      .ai-icon-button.ai-menu-button {
        display: inline-flex;
      }

      .ai-conversation-delete {
        opacity: 1;
      }

      .ai-topbar {
        grid-template-columns: minmax(0, 1fr) auto;
        padding-right: 10px;
        padding-left: 10px;
      }

      .ai-status span {
        display: none;
      }

      .ai-topbar-actions {
        gap: 6px;
      }

      .ai-messages {
        gap: 22px;
        padding: 24px 16px 18px;
        scrollbar-gutter: auto;
      }

      .ai-message.user .ai-message-body {
        max-width: 88%;
      }

      .ai-message-media {
        grid-template-columns: 1fr;
      }

      .ai-composer-dock {
        padding-right: 10px;
        padding-left: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="ai-app">
    <aside class="ai-sidebar" id="ai-sidebar">
      <div class="ai-sidebar-head">
        <a class="ai-brand" href="/admin/panel" aria-label="JiETNG Admin">
          <img src="/static/pics/logo.png" alt="">
          <span>JiETNG</span>
        </a>
        <button class="ai-icon-button ai-sidebar-close" id="ai-sidebar-close" type="button" aria-label="Close history">×</button>
      </div>
      <button class="ai-new-chat" id="ai-new-chat" type="button">
        <span aria-hidden="true">+</span>
        <span>New chat</span>
      </button>
      <div class="ai-sidebar-label">Recent</div>
      <nav class="ai-conversation-list" id="ai-conversation-list" aria-label="Conversation history"></nav>
      <div class="ai-sidebar-footer">
        <a href="/admin/panel">Admin panel</a>
        <a href="/admin/logout">Logout</a>
      </div>
    </aside>
    <button class="ai-sidebar-backdrop" id="ai-sidebar-backdrop" type="button" aria-label="Close history"></button>

    <div class="ai-stage">
      <header class="ai-topbar">
        <div class="ai-topbar-start">
          <button class="ai-icon-button ai-menu-button" id="ai-menu-button" type="button" aria-label="Open history">☰</button>
          <span class="ai-current-title" id="ai-current-title">New chat</span>
        </div>
        <div class="ai-topbar-actions">
          <span class="ai-status" id="ai-monitor-status"><i></i><span>Ready</span></span>
        </div>
      </header>

      <main class="ai-chat">
        <section class="ai-messages" id="ai-monitor-messages" aria-live="polite" aria-label="AI operations conversation"></section>

        <footer class="ai-composer-dock">
          <form class="ai-composer" id="ai-monitor-form">
            <div class="ai-attachments" id="ai-monitor-attachments" hidden></div>
            <label class="ai-attach" id="ai-monitor-attach" title="Add image" aria-label="Add image">
              <span aria-hidden="true">+</span>
              <input id="ai-monitor-images" type="file" accept="image/*" multiple>
            </label>
            <textarea
              class="ai-input"
              id="ai-monitor-input"
              maxlength="2000"
              rows="1"
              enterkeyhint="enter"
              aria-label="Message AI Operations"
            ></textarea>
            <button class="ai-send" id="ai-monitor-send" type="submit" title="Send" aria-label="Send">
              <span aria-hidden="true">↑</span>
            </button>
          </form>
        </footer>
      </main>
    </div>
  </div>
  {% include 'admin_ai_script.html' %}
</body>
</html>
