<!DOCTYPE html>
<html lang="{{ default_language }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <title>Admin Login | JiETNG</title>
  <link rel="icon" type="image/png" href="/static/pics/logo.png">
  {% include 'common_styles.html' %}

  <style>
    /* 页面特定样式 - Page-specific Styles */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      min-height: 100vh;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 52px 42px 36px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 750;
      color: var(--text-color);
      margin-bottom: 8px;
      letter-spacing: 0;
    }

    .login-header p {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .submit-btn {
      width: 100%;
      min-height: 48px;
      padding: 13px 18px;
      background: var(--info-color);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-base);
      position: relative;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
      box-shadow: var(--shadow-md);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .error-message {
      background: var(--error-light);
      border: 1px solid rgba(255, 59, 48, 0.22);
      color: var(--error-color);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 500;
    }

    @media (prefers-color-scheme: dark) {
      .error-message {
        color: var(--text-color);
      }
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-tertiary);
    }

    /* 全屏加载遮罩 */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--surface-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    #loading-overlay.active {
      display: flex;
    }

    #loading-overlay .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <script>
    // iOS standalone PWA 安全区域修复
    !function() {
      if (!navigator.standalone) return;
      var probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;top:0;left:0;width:0;padding-top:env(safe-area-inset-top,0px);pointer-events:none;visibility:hidden;';
      document.body.appendChild(probe);
      var sat = parseFloat(getComputedStyle(probe).paddingTop) || 0;
      document.body.removeChild(probe);
      if (!sat) sat = window.screen.height >= 852 ? 59 : 44;
      document.body.style.paddingTop = (24 + sat) + 'px';
    }();
  </script>
  <div id="loading-overlay"><div class="spinner"></div></div>
  <div class="login-container">
    <div class="login-header">
      <h1>Admin Panel</h1>
      <p>JiETNG Maimai DX Bot</p>
    </div>

    {% if error %}
    <div class="error-message">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/admin/panel" onsubmit="handleSubmit(event)">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div class="list-panel" style="margin-bottom: 24px;">
        <div class="list-item">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autofocus
          />
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">
        <span>Login</span>
      </button>
    </form>

    <div class="footer-note">
      Access restricted to authorized personnel
    </div>
  </div>

  <script>
    // 表单提交处理
    function handleSubmit(event) {
      document.getElementById('loading-overlay').classList.add('active');
    }
  </script>
</body>
</html>
