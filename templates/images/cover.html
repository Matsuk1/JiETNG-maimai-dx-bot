<div style="
  position: relative;
  width: 150px;
  height: {{ 180 if footer else 150 }}px;
  overflow: hidden;
  {% if footer %}border-radius:10px;
  {% endif %}background:{{ color if difficulty else '#723304' }}
">
  {% if cover %}
    <img src="{{ cover }}" style="
      position: absolute;
      left: {{ 3 if difficulty else 0 }}px;
      top: {{ 3 if difficulty else 0 }}px;
      width: {{ 144 if difficulty else 150 }}px;
      height: {{ 144 if difficulty else 150 }}px;
    ">
  {% endif %}
  {% if type_src %}
    <img src="{{ type_src }}" style="
      position: absolute;
      right: {{ 3 if difficulty else 0 }}px;
      top: {{ 126 if difficulty else 128 }}px;
      width: {{ 72 if difficulty else 75 }}px;
      height: {{ 21 if difficulty else 22 }}px;
    ">
  {% endif %}
  {% if achieved and not footer %}
    <div style="
      position: absolute;
      inset: 0;
      background: #323232b4;
    "></div>
  {% endif %}
  {% if status %}
    <div style="
      position: absolute;
      inset: 0 0 auto;
      height: 150px;
      background: #0009;
      display: flex;
      align-items: center;
      justify-content: center;
    ">
      <img src="{{ status }}" style="
        width: 75%;
        height: auto;
      ">
    </div>
  {% endif %}
  {% if footer %}
    <div style="
      position: absolute;
      top: 150px;
      height: 30px;
      width: 150px;
      display: flex;
      background: {{ color if achieved and not plate else 'white' }};
      color: {{ text_color if achieved else '#3c3c3c' }};
      align-items: center;
      justify-content: center;
    ">
      {% if plate %}
        {% for block in blocks %}
          <div style="
            height: 100%;
            flex: 1;
            background: {{ block }};
            {% if not loop.first %}border-left:2px solid #919191{% endif %}
          "></div>
        {% endfor %}
      {% else %}
        <div class="ellipsis" style="
          font-size: 19px;
          text-align: center;
          padding: 0 5px;
        ">{{ title }}</div>
      {% endif %}
    </div>
    <div style="
      position: absolute;
      inset: 0;
      border: 3px solid {{ '#919191' if plate else color }};
      border-radius: 10px;
      pointer-events: none;
    "></div>
  {% endif %}
</div>
