<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'">
    <style>
      @font-face {
        font-family: JiETNG;
        src: url('{{ font }}');
      }

      * {
        box-sizing: border-box;
      }

      html,body {
        margin: 0;
        padding: 0;
        background: transparent;
      }

      body {
        font-family: JiETNG,sans-serif;
        color: #141820;
        font-size: 28px;
        line-height: 1.3;
      }

      #image-root {
        position: relative;
        width: {{ width }}px;
        {% if height %}
        height: {{ height }}px;
        {% endif %}
        display: flow-root;
        overflow: hidden;
      }

      img {
        display: block;
        object-fit: fill;
      }

      .ellipsis {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .panel {
        background: white;
        border: 2px solid #c8d2e1;
        border-radius: 12px;
      }

      .outlined {
        color: white;
        -webkit-text-stroke: 3px #323232;
        paint-order: stroke fill;
      }
    </style>
  </head>
  <body>
    <main id="image-root">{{ body|safe }}</main>
  </body>
</html>
