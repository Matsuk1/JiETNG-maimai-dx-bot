<style>
  .glass-cover {
    position: relative;
    width: 150px;
    overflow: hidden;
    border: 3px solid var(--difficulty);
    border-radius: 18px;
    background: var(--footer-background);
    backdrop-filter: blur(14px) saturate(.95);
    color: #263650;
    box-shadow: 0 8px 18px #24355524, 0 2px 4px #24355512;
  }

  .glass-cover .glass-cover-art {
    width: 144px;
    height: 144px;
    border-radius: 13px 13px 0 0;
  }

  .glass-cover .glass-cover-type {
    position: absolute;
    top: 120px;
    right: 3px;
    width: 68px;
    height: 20px;
  }

  .glass-cover-overlay {
    position: absolute;
    inset: 0 0 auto;
    height: 144px;
    border-radius: 13px 13px 0 0;
    background: #27354f88;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glass-cover .glass-cover-status {
    width: 75%;
    height: auto;
  }

  .glass-cover-footer {
    position: absolute;
    inset: auto 0 0;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--footer-background);
    backdrop-filter: blur(14px) saturate(.95);
    font-size: 18px;
    padding: 0 4px;
  }

  .glass-cover-block {
    flex: 1;
    height: 13px;
    margin: 0 2px;
    border: 1px solid #ffffffcc;
    border-radius: 6px;
  }
</style>
<div class="glass-cover" style="
  --difficulty: {{ color if difficulty else '#a7bad6' }};
  --footer-background: {{ color if achieved and not plate else '#ffffffc7' }};
  height: {{ 180 if footer else 150 }}px;
">
  {% if cover %}
    <img class="glass-cover-art" src="{{ cover }}">
  {% endif %}
  {% if type_src %}
    <img class="glass-cover-type" src="{{ type_src }}">
  {% endif %}
  {% if status or (achieved and not footer) %}
    <div class="glass-cover-overlay">
      {% if status %}
        <img class="glass-cover-status" src="{{ status }}">
      {% endif %}
    </div>
  {% endif %}
  {% if footer %}
    <div class="glass-cover-footer" style="
      {% if achieved and not plate %}
      color: {{ text_color }};
      {% endif %}
    ">
      {% if plate %}
        {% for block in blocks %}
          <span class="glass-cover-block" style="background: {{ block }};"></span>
        {% endfor %}
      {% else %}
        <span class="ellipsis">{{ title }}</span>
      {% endif %}
    </div>
  {% endif %}
</div>
