<div class="glass-progress">
  {% include 'progress.html' %}
</div>
<style>
  .glass-progress {
    color: #293954;
    background: transparent;
  }

  .glass-progress .progress-heading,
  .glass-progress .plate-title {
    color: #293954;
    -webkit-text-stroke: 0;
    text-shadow: 0 2px 1px #ffffffb3;
  }

  .glass-progress .progress-mode-progress .progress-heading,
  .glass-progress .progress-mode-plate .plate-heading {
    border: 3px solid #91a8d8;
    border-radius: 30px;
    background: linear-gradient(135deg, #ffffffc7, #f2f5ff99);
    box-shadow: inset 0 1px 2px #ffffff, 0 8px 18px #24355524, 0 2px 4px #24355512;
    backdrop-filter: blur(14px) saturate(.95);
    padding: 12px 28px;
  }

  .glass-progress .progress-mode-progress .level-list,
  .glass-progress .progress-mode-plate .level-list {
    border: 3px solid #91a8d8;
    border-radius: 30px;
    background: linear-gradient(135deg, #ffffff70, #f2f5ff4d);
    box-shadow: inset 0 1px 2px #ffffff, 0 8px 18px #24355524, 0 2px 4px #24355512;
    backdrop-filter: blur(14px) saturate(.9);
    padding: 18px 12px 0;
  }

  .glass-progress .summary,
  .glass-progress .plate-stat {
    border: 3px solid var(--accent);
    border-radius: 28px;
    background: linear-gradient(135deg, #ffffffc7, #f2f5ff99);
    box-shadow: inset 0 1px 2px #ffffff, 0 8px 18px #24355524, 0 2px 4px #24355512;
    backdrop-filter: blur(14px) saturate(.95);
  }

  .glass-progress .summary-label {
    color: #586987;
  }

  .glass-progress .level-label {
    border: 2px solid #ffffffd9;
    background: #ffffffc7;
    backdrop-filter: blur(14px) saturate(.95);
    box-shadow: inset 0 1px 2px #ffffff, 0 8px 18px #24355524, 0 2px 4px #24355512;
    color: #354b6c;
  }
</style>
