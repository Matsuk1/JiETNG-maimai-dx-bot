{# Keep table data and sizing shared; only the visual treatment changes. #}
<div class="glass-song {{ 'glass-song-table' if mode == 'table' else '' }}">
  {% include 'song.html' %}
</div>
<style>
  .glass-song {
    color: #253650;
  }

  /* Reserve transparent space so the screenshot includes the outer shadows. */
  .glass-song-table { padding: 18px 24px 32px; }
  .glass-song-table .song-table { gap: 16px; }
  .glass-song.glass-song-table .song-row,
  .glass-song.glass-song-table .song-section-heading,
  .glass-song.glass-song-table .song-rating-heading {
    box-shadow: inset 0 1px 2px #ffffff, 0 6px 12px -3px #24355526;
  }

  .glass-song .song-section-heading,
  .glass-song .song-rating-heading,
  .glass-song .song {
    border: 2px solid #ffffffdd;
    border-radius: 30px;
    background: linear-gradient(135deg, #ffffffc7, #f2f5ff99);
    backdrop-filter: blur(14px) saturate(.95);
    box-shadow: inset 0 1px 2px #ffffff, 0 8px 18px #24355524, 0 2px 4px #24355512;
  }

  .glass-song .song-cover {
    border: 3px solid #a9bad5;
    border-radius: 24px;
  }

  .glass-song .song-row {
    border: 3px solid var(--border);
    border-radius: 23px;
    background: linear-gradient(135deg, #ffffffc7, #f2f5ff99);
    backdrop-filter: blur(14px) saturate(.95);
    box-shadow: inset 0 1px 2px #ffffff, 0 8px 18px #24355524, 0 2px 4px #24355512;
  }

  .glass-song .song-title {
    color: #263955;
  }
</style>
