<!DOCTYPE html>
{% set loading_text = i18n_catalog('web.loading') %}
<html lang="{{ language or default_language }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>{{ i18n_select(loading_text, language=language, default_language=default_language) }} | JiETNG</title>
  <link rel="icon" type="image/png" href="/static/pics/logo.png">
  {% include 'common_styles.html' %}

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>

  {% if redirect_url %}
  <script>
    setTimeout(function() {
      window.location.href = "{{ redirect_url }}";
    }, 3000);
  </script>
  {% endif %}
</body>
</html>
