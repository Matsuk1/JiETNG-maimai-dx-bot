<!DOCTYPE html>
{% set loading_text = i18n_catalog('web.loading') %}
<html lang="{{ language or default_language }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>{{ i18n_select(loading_text, language=language, default_language=default_language) }} | JiETNG</title>
  <link rel="icon" type="image/png" href="/static/pics/logo-padded.png">
  {% include 'common_styles.html' %}

  <style media="not all">
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <link rel="stylesheet" href="/static/user-portal.css?v=20261027-5">
</head>
<body class="user-portal portal-loading-page">
  <main class="portal-loading-card" aria-live="polite" aria-busy="true">
    <div class="ui-brand" aria-label="JiETNG">
      <span class="ui-brand-mark" aria-hidden="true">J</span>
      <span class="ui-brand-copy"><span class="ui-brand-name">JiETNG</span><span class="ui-brand-context">Account</span></span>
    </div>
    <div class="spinner"></div>
  </main>

  {% if redirect_url %}
  <script>
    setTimeout(function() {
      window.location.href = "{{ redirect_url }}";
    }, 3000);
  </script>
  {% endif %}
</body>
</html>
