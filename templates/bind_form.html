<!DOCTYPE html>
<html lang="{{ user_language or default_language }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <title id="page-title">SEGA アカウント連携 | JiETNG</title>
  <link rel="icon" type="image/png" href="/static/pics/logo.png">
  {% include 'common_styles.html' %}

  <style>
    /* 页面特定样式 - Page-specific Styles */
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 56px 24px;
      padding-top: calc(56px + env(safe-area-inset-top));
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 44px 34px 34px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }

    h2 {
      text-align: center;
      font-size: 28px;
      font-weight: 750;
      color: var(--text-color);
      margin-bottom: 30px;
      letter-spacing: 0;
      line-height: 1.16;
    }

    .hint-text {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .hint-text.hidden {
      display: none;
    }

    .bind-type-help {
      display: none;
      color: var(--text-tertiary);
      font-size: 11px;
      line-height: 1.45;
    }

    .bind-type-help.active {
      display: flex;
    }

    input[type="submit"] {
      width: 100%;
      min-height: 48px;
      padding: 13px 18px;
      background: var(--info-color);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-base);
      margin-top: 4px;
    }

    input[type="submit"]:hover {
      background: var(--accent-hover);
      box-shadow: var(--shadow-md);
    }

    input[type="submit"]:active {
      transform: scale(0.98);
    }

    /* 加载遮罩 */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(245, 245, 247, 0.82);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    #loading-overlay.active {
      display: flex;
    }

    #loading-overlay .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .aime-modal {
      width: 100%;
      max-width: 420px;
      max-height: calc(100vh - 48px);
      overflow: auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 28px;
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }

    .aime-modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .aime-modal-close {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 22px;
      line-height: 28px;
      cursor: pointer;
    }

    .aime-modal-close:disabled {
      cursor: default;
      opacity: 0.45;
    }

    .aime-modal h3 {
      margin: 0 0 8px;
      color: var(--text-color);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .aime-modal p {
      margin: 0 0 16px;
      color: var(--text-tertiary);
      font-size: 12px;
      line-height: 1.5;
    }

    .aime-choice-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .aime-modal-loading {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 112px;
    }

    .aime-modal-loading.active {
      display: flex;
    }

    .aime-modal-spinner {
      width: 42px;
      height: 42px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .aime-choice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      color: var(--text-color);
      background: var(--surface-bg);
      box-shadow: var(--shadow-sm);
      transition: border-color var(--transition-base), box-shadow var(--transition-base);
    }

    .aime-choice.selected {
      border-color: var(--info-color);
      box-shadow: inset 0 0 0 2px rgba(48, 145, 255, 0.42),
                  0 0 14px rgba(48, 145, 255, 0.24);
    }

    .aime-choice-version {
      flex: 0 0 auto;
      padding: 0;
      background: transparent;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0;
      line-height: 1;
      pointer-events: none;
    }

    .aime-choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .aime-choice-icon {
      width: 64px;
      height: 64px;
      flex: 0 0 auto;
      border-radius: 8px;
      object-fit: cover;
      background: var(--border-color);
    }

    .aime-choice-main {
      min-width: 0;
      flex: 1;
      height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .aime-choice-trophy {
      position: relative;
      width: min(100%, 226px);
      height: 16px;
      box-sizing: border-box;
      flex: 0 0 16px;
    }

    .aime-choice-trophy img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .aime-choice-trophy span {
      position: absolute;
      inset: 0 8px;
      display: block;
      line-height: 16px;
      padding: 0 10px;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 1px 2px #000000, 0 -1px 2px #000000;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .aime-choice-row {
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .aime-choice-name-row,
    .aime-choice-rating-row {
      display: flex;
      align-items: center;
      gap: 6px;
      width: min(100%, 226px);
      min-width: 0;
    }

    .aime-choice-name {
      width: auto;
      height: 21px;
      box-sizing: border-box;
      padding: 3px 9px;
      border: 1px solid rgba(180, 180, 180, 0.9);
      border-radius: 7px;
      background: #ffffff;
      color: #111111;
      font-size: 12px;
      font-weight: 600;
      line-height: 13px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1 1 auto;
    }

    .aime-choice-class {
      width: 38px;
      height: 21px;
      flex: 0 0 auto;
      object-fit: contain;
    }

    .aime-choice-rating {
      position: relative;
      width: 112px;
      height: 22px;
      box-sizing: border-box;
      flex: 0 0 auto;
    }

    .aime-choice-course {
      width: 52px;
      height: 22px;
      flex: 0 0 auto;
      object-fit: contain;
    }

    .aime-choice-rating img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .aime-choice-rating span {
      position: absolute;
      inset: 1px 10px 0 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      transform: translateX(-4px);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      text-shadow: 0 1px 2px #000000, 0 -1px 2px #000000;
    }

    .aime-choice-meta {
      margin-top: 3px;
      color: var(--text-tertiary);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    #aime-confirm-btn {
      width: 100%;
      min-height: 46px;
      padding: 13px;
      background: var(--info-color);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-base);
    }

    #aime-confirm-btn:hover {
      background: var(--accent-hover);
      box-shadow: var(--shadow-md);
    }

    /* 移动端优化 */
    @media (max-width: 600px) {
      body {
        padding: 16px;
        padding-top: calc(16px + env(safe-area-inset-top));
      }

      .container {
        padding: 34px 22px 24px;
      }

      h2 {
        font-size: 24px;
        margin-bottom: 24px;
      }

      .aime-choice-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="loading-overlay"><div class="spinner"></div></div>
  <div class="container">
    <h2 id="page-heading">SEGA アカウント連携</h2>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <input type="hidden" id="aime" name="aime" value="{% if mode == 'rebind' %}{{ aime }}{% else %}0{% endif %}"/>
      <input type="hidden" id="aime_confirmed" name="aime_confirmed" value="0"/>
      {% if mode != 'rebind' %}
      <input type="hidden" id="timezone" name="timezone" value="9"/>
      {% endif %}

      <div class="list-panel" style="margin-bottom: 20px;">
        {% if mode != 'rebind' %}
        <div class="list-item">
          <label for="language" id="label-language">言語</label>
          <select id="language" name="language" required>
            {% for option in language_options %}
            <option value="{{ option.code }}">{{ option.label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="list-item bind-type-help active" id="language-platform-hint">
          言語設定は LINE 以外の外部プラットフォームには反映されない場合があります。
        </div>

        <div class="list-item">
          <label for="bind_type" id="label-bind-type">連携方式</label>
          <select id="bind_type" name="bind_type" required>
            <option value="sega" id="opt-bind-sega">SEGA アカウント</option>
            <option value="import_token" id="opt-bind-import">Import Token のみ</option>
          </select>
        </div>
        <div class="list-item bind-type-help" id="bind-type-help">
          SEGA ID を保存せず、書き出しツールから成績をアップロードします。
        </div>
        {% endif %}

        <div class="list-item sega-field">
          <label for="segaid" id="label-segaid">セガID</label>
          <input type="text" id="segaid" name="segaid" required {% if mode == 'rebind' %}value="{{ segaid }}" readonly{% endif %} />
        </div>

        <div class="list-item sega-field">
          <label for="password" id="label-password">パスワード</label>
          <input type="password" id="password" name="password" required {% if mode == 'rebind' %}value="{{ password }}"{% endif %} />
        </div>

        <div class="list-item" id="version-container">
          <label for="ver" id="label-version">バージョン</label>
          <select id="ver" name="ver" required>
            <option value="jp" id="opt-jp" {% if mode != 'rebind' or version == 'jp' %}selected{% endif %}>日本版</option>
            <option value="intl" id="opt-intl" {% if mode == 'rebind' and version == 'intl' %}selected{% endif %}>海外版</option>
          </select>
        </div>

      </div>

      <input type="submit" id="submit-btn" value="連携" />
    </form>

    <div class="notice">
      <strong id="notice-title">ご利用に関するご注意</strong><br>
      <div id="notice-content"></div>
    </div>
  </div>

  <div class="modal-overlay" id="aime-modal-overlay" aria-hidden="true">
    <div class="aime-modal" role="dialog" aria-modal="true" aria-labelledby="aime-modal-title">
      <div class="aime-modal-header">
        <h3 id="aime-modal-title">Aime を選択</h3>
        <button type="button" class="aime-modal-close" id="aime-modal-close" aria-label="Close">&times;</button>
      </div>
      <p id="aime-modal-description">連携するアカウントを選択してください。</p>
      <div class="aime-modal-loading" id="aime-modal-loading">
        <div class="aime-modal-spinner"></div>
      </div>
      <div class="aime-choice-list" id="aime-choice-list"></div>
      <button type="button" id="aime-confirm-btn">確定</button>
    </div>
  </div>

  <script>
    const defaultLanguage = {{ default_language | tojson }};
    const translations = {{ i18n_catalog('web.bind') | tojson }};

    const noticeTranslations = {{ i18n_catalog('web.bind_notice_html') | tojson }};

    function translationFor(catalog, lang) {
      return catalog[lang] || catalog[defaultLanguage] || Object.values(catalog)[0];
    }

    function updateLanguage(lang) {
      const t = translationFor(translations, lang);
      const mode = '{{ mode }}' || 'bind';

      // Update page title
      document.getElementById('page-title').textContent = mode === 'rebind' ? t.pageTitleRebind : t.pageTitle;

      // Update heading
      document.getElementById('page-heading').textContent = mode === 'rebind' ? t.headingRebind : t.heading;

      // Update labels
      document.getElementById('label-segaid').textContent = t.labelSegaid;
      document.getElementById('label-password').textContent = t.labelPassword;
      document.getElementById('label-version').textContent = t.labelVersion;

      const labelLanguage = document.getElementById('label-language');
      if (labelLanguage) labelLanguage.textContent = t.labelLanguage;
      const languagePlatformHint = document.getElementById('language-platform-hint');
      if (languagePlatformHint) languagePlatformHint.textContent = t.languagePlatformHint;

      const labelBindType = document.getElementById('label-bind-type');
      if (labelBindType) labelBindType.textContent = t.labelBindType;
      const optBindSega = document.getElementById('opt-bind-sega');
      if (optBindSega) optBindSega.textContent = t.optBindSega;
      const optBindImport = document.getElementById('opt-bind-import');
      if (optBindImport) optBindImport.textContent = t.optBindImport;

      // Update version options
      document.getElementById('opt-jp').textContent = t.optJp;
      document.getElementById('opt-intl').textContent = t.optIntl;

      // Update submit button
      updateBindTypeUi();

      // Update notice title
      document.getElementById('notice-title').textContent = t.noticeTitle;
      document.getElementById('aime-modal-title').textContent = t.aimeModalTitle;
      document.getElementById('aime-modal-description').textContent = t.aimeModalDescription;
      document.getElementById('aime-confirm-btn').textContent = t.aimeConfirm;

      document.getElementById('notice-content').innerHTML = translationFor(noticeTranslations, lang);

    }

    // 自动检测用户时区并转换为 UTC 偏移量
    function detectUserTimezone() {
      try {
        // 获取当前时间的 UTC 偏移量（分钟）
        const offsetMinutes = -new Date().getTimezoneOffset();
        // 转换为小时
        const offsetHours = Math.floor(offsetMinutes / 60);
        return offsetHours;
      } catch (e) {
        // 如果检测失败，返回 UTC+9（日本标准时间）
        return 9;
      }
    }

    function updateBindTypeUi() {
      const lang = document.getElementById('language')?.value || {{ (user_language or default_language) | tojson }};
      const t = translationFor(translations, lang);
      const mode = '{{ mode }}' || 'bind';
      const bindType = document.getElementById('bind_type')?.value || 'sega';
      const importOnly = mode !== 'rebind' && bindType === 'import_token';

      document.querySelectorAll('.sega-field').forEach(el => {
        el.style.display = importOnly ? 'none' : 'flex';
      });
      document.getElementById('segaid').required = !importOnly;
      document.getElementById('password').required = !importOnly;
      const versionContainer = document.getElementById('version-container');
      if (versionContainer) {
        versionContainer.style.display = importOnly ? 'flex' : 'none';
      }

      const help = document.getElementById('bind-type-help');
      if (help) {
        help.textContent = t.bindTypeImportHelp;
        help.classList.toggle('active', importOnly);
      }

      document.getElementById('submit-btn').value = mode === 'rebind'
        ? t.submitBtnRebind
        : (importOnly ? t.submitBtnImport : t.submitBtn);
      if (importOnly) {
        document.getElementById('aime_confirmed').value = '0';
        document.getElementById('aime').value = '0';
      }
    }

    function getCurrentTranslations() {
      const lang = document.getElementById('language')?.value || {{ (user_language or default_language) | tojson }};
      return translationFor(translations, lang);
    }

    let aimeRequestId = 0;

    function updateSelectedAimeChoice() {
      document.querySelectorAll('.aime-choice').forEach(choice => {
        const input = choice.querySelector('input[name="aime_choice"]');
        choice.classList.toggle('selected', Boolean(input?.checked));
      });
    }

    function renderAimeChoices(candidates) {
      const t = getCurrentTranslations();
      const list = document.getElementById('aime-choice-list');
      list.innerHTML = '';

      candidates.forEach((candidate, index) => {
        const value = String(candidate.idx ?? index);
        const label = document.createElement('label');
        label.className = 'aime-choice';

        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'aime_choice';
        input.value = value;
        input.dataset.ver = candidate.ver || 'jp';
        if (index === 0) input.checked = true;

        let iconElement;
        if (candidate.icon_url) {
          iconElement = document.createElement('img');
          iconElement.alt = '';
          iconElement.loading = 'lazy';
          iconElement.src = candidate.icon_url;
        } else {
          iconElement = document.createElement('div');
        }
        iconElement.className = 'aime-choice-icon';

        const main = document.createElement('div');
        main.className = 'aime-choice-main';

        if (candidate.trophy_url || candidate.trophy) {
          const trophy = document.createElement('div');
          trophy.className = 'aime-choice-trophy';
          if (candidate.trophy_url) {
            const trophyImage = document.createElement('img');
            trophyImage.alt = '';
            trophyImage.loading = 'lazy';
            trophyImage.src = candidate.trophy_url;
            trophy.appendChild(trophyImage);
          }
          const trophyText = document.createElement('span');
          trophyText.textContent = candidate.trophy || '';
          trophy.appendChild(trophyText);
          main.appendChild(trophy);
        }

        const row = document.createElement('div');
        row.className = 'aime-choice-row';

        const nameRow = document.createElement('div');
        nameRow.className = 'aime-choice-name-row';

        const name = document.createElement('div');
        name.className = 'aime-choice-name';
        name.textContent = candidate.name || `${t.aimeFallbackName} ${index + 1}`;

        nameRow.appendChild(name);

        if (candidate.class_rank_url) {
          const classRank = document.createElement('img');
          classRank.className = 'aime-choice-class';
          classRank.alt = '';
          classRank.loading = 'lazy';
          classRank.src = candidate.class_rank_url;
          nameRow.appendChild(classRank);
        }

        row.appendChild(nameRow);

        if (candidate.rating_block_url || candidate.rating) {
          const ratingRow = document.createElement('div');
          ratingRow.className = 'aime-choice-rating-row';

          const rating = document.createElement('div');
          rating.className = 'aime-choice-rating';
          if (candidate.rating_block_url) {
            const ratingImage = document.createElement('img');
            ratingImage.alt = '';
            ratingImage.loading = 'lazy';
            ratingImage.src = candidate.rating_block_url;
            rating.appendChild(ratingImage);
          }
          const ratingText = document.createElement('span');
          ratingText.textContent = candidate.rating || '0';
          rating.appendChild(ratingText);
          ratingRow.appendChild(rating);

          if (candidate.course_rank_url) {
            const courseRank = document.createElement('img');
            courseRank.className = 'aime-choice-course';
            courseRank.alt = '';
            courseRank.loading = 'lazy';
            courseRank.src = candidate.course_rank_url;
            ratingRow.appendChild(courseRank);
          }

          const version = document.createElement('div');
          version.className = 'aime-choice-version';
          version.textContent = candidate.version_label || (candidate.ver === 'intl' ? '🇺🇳' : '🇯🇵');
          ratingRow.appendChild(version);

          row.appendChild(ratingRow);
        }

        const metaParts = [];

        const meta = document.createElement('div');
        meta.className = 'aime-choice-meta';
        meta.textContent = metaParts.join(' / ');

        main.appendChild(row);
        if (metaParts.length) main.appendChild(meta);
        label.appendChild(input);
        label.appendChild(iconElement);
        label.appendChild(main);
        label.addEventListener('click', () => requestAnimationFrame(updateSelectedAimeChoice));
        list.appendChild(label);
      });
      updateSelectedAimeChoice();
    }

    function setAimeModalLoading(loading) {
      document.getElementById('aime-modal-loading').classList.toggle('active', loading);
      document.getElementById('aime-choice-list').style.display = loading ? 'none' : 'flex';
      document.getElementById('aime-confirm-btn').style.display = loading ? 'none' : 'block';
      document.getElementById('aime-modal-close').disabled = loading && document.getElementById('aime_confirmed').value === '1';
    }

    function openAimeModal({ loading = false, candidates = [] } = {}) {
      if (candidates.length) {
        renderAimeChoices(candidates);
      } else {
        document.getElementById('aime-choice-list').innerHTML = '';
      }
      setAimeModalLoading(loading);
      const overlay = document.getElementById('aime-modal-overlay');
      overlay.classList.add('active');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function closeAimeModal() {
      const overlay = document.getElementById('aime-modal-overlay');
      overlay.classList.remove('active');
      overlay.setAttribute('aria-hidden', 'true');
    }

    async function submitFinalForm(form, { modalLoading = false } = {}) {
      if (modalLoading) {
        openAimeModal({ loading: true });
      } else {
        document.getElementById('loading-overlay').classList.add('active');
      }
      try {
        const response = await fetch(window.location.href, {
          method: 'POST',
          body: new FormData(form)
        });
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        if (modalLoading) {
          setAimeModalLoading(false);
        } else {
          document.getElementById('loading-overlay').classList.remove('active');
        }
      }
    }

    async function fetchAimeCandidates(form) {
      const formData = new FormData(form);
      formData.set('aime_preview', '1');
      const response = await fetch(window.location.href, {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'fetch' }
      });
      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.message || getCurrentTranslations().accountListError);
      }
      return data.candidates || [];
    }

    // SEGA 绑定先在弹窗内加载账号列表，避免 LINE WKWebView 页面导航冻结渲染
    document.querySelector('form').addEventListener('submit', async function(event) {
      event.preventDefault();
      const mode = '{{ mode }}' || 'bind';
      const bindType = document.getElementById('bind_type')?.value || 'sega';
      const importOnly = mode !== 'rebind' && bindType === 'import_token';

      if (importOnly || document.getElementById('aime_confirmed').value === '1') {
        await submitFinalForm(this);
        return;
      }

      const requestId = ++aimeRequestId;
      openAimeModal({ loading: true });
      try {
        const candidates = await fetchAimeCandidates(this);
        if (requestId !== aimeRequestId) return;
        openAimeModal({ candidates });
      } catch (e) {
        if (requestId !== aimeRequestId) return;
        closeAimeModal();
        alert(e.message || getCurrentTranslations().accountListError);
      }
    });

    document.getElementById('aime-modal-close').addEventListener('click', function() {
      if (this.disabled) return;
      aimeRequestId += 1;
      document.getElementById('aime_confirmed').value = '0';
      closeAimeModal();
    });

    document.getElementById('aime-confirm-btn').addEventListener('click', async function() {
      const selected = document.querySelector('input[name="aime_choice"]:checked');
      if (!selected) return;

      const form = document.querySelector('form');
      document.getElementById('aime').value = selected.value;
      document.getElementById('ver').value = selected.dataset.ver || 'jp';
      document.getElementById('aime_confirmed').value = '1';
      await submitFinalForm(form, { modalLoading: true });
    });

    // 页面加载时自动设置用户语言和预填充数据
    window.addEventListener('DOMContentLoaded', function() {
      const userLanguage = {{ (user_language or default_language) | tojson }};
      const mode = '{{ mode }}' || 'bind';
      updateLanguage(userLanguage);

      const bindTypeSelect = document.getElementById('bind_type');
      if (bindTypeSelect) {
        bindTypeSelect.addEventListener('change', updateBindTypeUi);
      }

      const languageSelect = document.getElementById('language');
      if (languageSelect) {
        languageSelect.value = userLanguage;

        // 监听语言选择变化，实时切换界面语言
        languageSelect.addEventListener('change', function() {
          updateLanguage(this.value);
        });
      }

      updateBindTypeUi();

      // bind 模式下自动检测用户时区
      if (mode !== 'rebind') {
        const timezoneSelect = document.getElementById('timezone');
        if (timezoneSelect) {
          const detectedTimezone = Math.max(-12, Math.min(14, detectUserTimezone()));
          timezoneSelect.value = detectedTimezone.toString();
        }
      }
    });
  </script>
</body>
</html>
