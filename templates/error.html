<!DOCTYPE html>
<html lang="{{ language or default_language }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Error | JiETNG</title>
  <link rel="icon" type="image/png" href="/static/pics/logo.png">
  {% include 'common_styles.html' %}

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
    }

    .error-box {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 34px;
      box-shadow: var(--shadow-lg);
      text-align: center;
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
    }

    .language-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }

    .language-row select {
      width: auto;
      min-width: 132px;
      padding: 8px 32px 8px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 999px;
    }

    .error-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: var(--error-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: var(--error-color);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 750;
      color: var(--text-color);
      margin-bottom: 12px;
      letter-spacing: 0;
    }

    p {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.6;
      text-align: center;
    }

    .notice {
      text-align: left;
    }

    .notice strong {
      display: inline-block;
      color: var(--text-secondary);
      font-size: 12px;
      margin-bottom: 4px;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .error-box {
        padding: 24px;
      }

      .language-row {
        justify-content: stretch;
      }

      .language-row select {
        width: 100%;
      }

      .error-icon {
        width: 64px;
        height: 64px;
        font-size: 38px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="error-box">
    <div class="language-row">
      <select id="language-select" aria-label="Language">
        {% for option in language_options %}
        <option value="{{ option.code }}">{{ option.label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="error-icon">!</div>

    <h1 id="error-title">Error</h1>
    <p id="error-message">{{ message|safe }}</p>
    <div class="notice" id="error-notice"></div>
  </div>

  <script>
    const defaultLanguage = {{ default_language | tojson }};
    const initialLanguage = {{ (language or default_language) | tojson }};
    const initialMessage = {{ message | tojson }};
    const messageI18n = {{ (message_i18n or {}) | tojson }};

    const i18n = {{ i18n_catalog('web.error') | tojson }};
    const notices = {{ i18n_catalog('web.notice_html') | tojson }};

    function messageFor(lang) {
      if (messageI18n[lang]) return messageI18n[lang];
      const t = i18n[lang] || i18n[defaultLanguage];
      return initialMessage || t.fallback_message;
    }

    function setLanguage(lang) {
      const selectedLanguage = i18n[lang] ? lang : defaultLanguage;
      const t = i18n[selectedLanguage];
      document.documentElement.lang = lang;
      document.title = t.title + ' | JiETNG';
      document.getElementById('error-title').textContent = t.title;
      document.getElementById('error-message').innerHTML = messageFor(lang);
      document.getElementById('error-notice').innerHTML = notices[selectedLanguage];
      document.getElementById('language-select').value = lang;
    }

    document.getElementById('language-select').addEventListener('change', function() {
      setLanguage(this.value);
    });
    setLanguage(initialLanguage);
  </script>
</body>
</html>
